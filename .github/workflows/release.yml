name: Build Windows applications
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run account-free fixture checks
        shell: pwsh
        run: dotnet run --project GlassPlayer.Tests -c Release -r win-x64 -- --ci
      - name: Build and verify application and installer
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Architecture '${{ matrix.architecture }}'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: artifacts/installers/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          merge-multiple: true
          path: release-assets
      - name: Fetch verified upstream source archives
        shell: pwsh
        run: ./scripts/Get-UpstreamSources.ps1 -OutputDirectory release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --latest --title "GlassPlayer $GITHUB_REF_NAME — Windows ARM64 and x64" --notes-file RELEASE-NOTES.md
